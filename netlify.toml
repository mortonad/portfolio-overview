# Netlify 部署設定
[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/作品集總覽.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
